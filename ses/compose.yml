# Telefon hattı (Netgsm) ve/veya masa telefonu → santral → ses asistanı.
# Ana docker-compose.yml'ye .env'deki COMPOSE_FILE ile eklenir; yollar ana
# dosyanın klasörüne (stayline-sunucu) göredir. Kurulum: GuestFlow/ses/telefon-kur.sh
services:
  santral:
    build: ./GuestFlow/ses/santral
    profiles: [telefon]
    restart: unless-stopped
    # SIP ve ses (RTP) için ana makinenin ağı; Netgsm'e kendisi bağlanır (kayıt),
    # içeri port açmak gerekmez
    network_mode: host
    environment:
      SANTRAL_SIP_SUNUCU: ${SANTRAL_SIP_SUNUCU:-}
      SANTRAL_SIP_PORT: ${SANTRAL_SIP_PORT:-5060}
      SANTRAL_SIP_KULLANICI: ${SANTRAL_SIP_KULLANICI:-}
      SANTRAL_SIP_SIFRE: ${SANTRAL_SIP_SIFRE:-}
      SANTRAL_SIP_ALAN: ${SANTRAL_SIP_ALAN:-}
      SANTRAL_DIS_IP: ${SANTRAL_DIS_IP:-}
      MASA_SIFRE: ${MASA_SIFRE:-}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  telefon:
    # Santral ile ses asistanı arasındaki köprü (aynı asistan kodu)
    build: ./GuestFlow/ses/asistan
    command: ["python", "telefon.py"]
    profiles: [telefon]
    restart: unless-stopped
    network_mode: host
    environment:
      VOICE_API_SECRET: ${VOICE_API_SECRET:-}
      SES_AJAN_KIMLIGI: ${SES_AJAN_KIMLIGI:-yerel-ses}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-}
      SES_DILLER: ${SES_DILLER:-tr,en,de,ru}
      SES_VAD_GUVEN: ${SES_VAD_GUVEN:-0.8}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
